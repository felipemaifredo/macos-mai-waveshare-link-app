; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911 touch, CH422G IO expander)
; ESP32-S3-WROOM-1-N8R8: 8 MB flash, 8 MB octal PSRAM.

[env:waveshare-lcd7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = native USB port ("USB"), Serial0 = UART port ("UART"). The firmware talks on both.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL configured by flags only (no lv_conf.h)
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_THEME_DEFAULT_DARK=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1

lib_deps =
    lvgl/lvgl @ 9.4.0
    bblanchon/ArduinoJson @ ^7.4.2
